<svg xmlns="http://www.w3.org/2000/svg" width="854" height="90" viewBox="0 0 854 90">
<defs>
  <clipPath id="frame"><rect width="854" height="90" rx="24"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".25"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs><style>
  .t{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
  .in{animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}
  .d1{animation-delay:.15s} .d2{animation-delay:.3s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pulse{animation:p 3.5s ease-in-out infinite}
  @keyframes p{50%{opacity:.55}}
  
</style><g clip-path="url(#frame)">
  <rect width="854" height="90" fill="#0b0d12"/>
  <g filter="url(#blur)" opacity=".35">
    <circle cx="150" cy="60" r="80" fill="#bf5af2" opacity="1"><animateTransform attributeName="transform" type="translate" values="0 0;80 -20;0 0" dur="25.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
    <circle cx="700" cy="30" r="80" fill="#0a84ff" opacity="1"><animateTransform attributeName="transform" type="translate" values="0 0;-90 20;0 0" dur="28.8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
    <circle cx="430" cy="80" r="60" fill="#64d2ff" opacity="1"><animateTransform attributeName="transform" type="translate" values="0 0;30 -30;0 0" dur="19.8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
  </g>
  <clipPath id="foot"><rect x="8" y="8" width="838" height="74" rx="20"/></clipPath>
  <rect x="8" y="8" width="838" height="74" rx="20" fill="#fff" fill-opacity=".06"/>
  <rect x="8" y="8" width="838" height="74" rx="20" fill="url(#sheen)"/>
  
  <rect x="8.75" y="8.75" width="836.5" height="72.5" rx="20" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <text class="t" x="427" y="51" text-anchor="middle" fill="#fff" fill-opacity=".8" font-size="15">Thanks for stopping by  ·  let’s build something</text>
</g>
<rect x=".5" y=".5" width="853" height="89" rx="24" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
