<svg xmlns="http://www.w3.org/2000/svg" width="854" height="60" viewBox="0 0 854 60">
<defs>
  <clipPath id="frame"><rect width="854" height="60" rx="20"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".25"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs><style>
  .t{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
  .in{animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}
  .d1{animation-delay:.15s} .d2{animation-delay:.3s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pulse{animation:p 2s ease-in-out infinite}
  @keyframes p{50%{opacity:.3}}
  
</style><g clip-path="url(#frame)">
  <rect width="854" height="60" fill="#0b0d12"/>
  <g filter="url(#blur)" opacity=".8">
    <circle cx="60" cy="30" r="45" fill="#ff9f0a" opacity="1"><animateTransform attributeName="transform" type="translate" values="0 0;50 0;0 0" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
    <circle cx="820" cy="30" r="35" fill="#ff9f0a" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 0;-30 0;0 0" dur="13s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
  </g>
  <clipPath id="bar"><rect x="4" y="4" width="846" height="52" rx="16"/></clipPath>
  <rect x="4" y="4" width="846" height="52" rx="16" fill="#fff" fill-opacity=".06"/>
  <rect x="4" y="4" width="846" height="52" rx="16" fill="url(#sheen)"/>
  <g clip-path="url(#bar)"><rect x="-300" y="4" width="211" height="52" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" values="-296;1150;1150" keyTimes="0;.45;1" dur="9s" repeatCount="indefinite"/></rect></g>
  <rect x="4.75" y="4.75" width="844.5" height="50.5" rx="16" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <circle cx="30" cy="30" r="5" fill="#ff9f0a"/>
  <text class="t" x="46" y="37" fill="#fff" font-size="20" font-weight="600">GitHub stats</text>
</g>
<rect x=".5" y=".5" width="853" height="59" rx="20" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
