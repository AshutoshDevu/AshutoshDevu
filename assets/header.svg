<svg xmlns="http://www.w3.org/2000/svg" width="854" height="260" viewBox="0 0 854 260">
<defs>
  <clipPath id="frame"><rect width="854" height="260" rx="28"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".25"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs><style>
  .t{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}
  .in{animation:in 1.2s cubic-bezier(.2,.8,.2,1) both}
  .d1{animation-delay:.15s} .d2{animation-delay:.3s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pulse{animation:p 3.5s ease-in-out infinite}
  @keyframes p{50%{opacity:.55}}
  
</style><g clip-path="url(#frame)">
  <rect width="854" height="260" fill="#0b0d12"/>
  <g filter="url(#blur)" opacity=".5">
    <circle cx="200" cy="90" r="110" fill="#0a84ff" opacity="1"><animateTransform attributeName="transform" type="translate" values="0 0;60 25;0 0" dur="25.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
    <circle cx="640" cy="170" r="120" fill="#bf5af2" opacity="1"><animateTransform attributeName="transform" type="translate" values="0 0;-70 -20;0 0" dur="28.8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
    <circle cx="440" cy="40" r="80" fill="#64d2ff" opacity="0.7"><animateTransform attributeName="transform" type="translate" values="0 0;-40 40;0 0" dur="21.6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle>
  </g>
  <clipPath id="card"><rect x="117" y="44" width="620" height="172" rx="36"/></clipPath>
  <rect x="117" y="44" width="620" height="172" rx="36" fill="#fff" fill-opacity=".06"/>
  <rect x="117" y="44" width="620" height="172" rx="36" fill="url(#sheen)"/>
  <g clip-path="url(#card)"><rect x="-300" y="44" width="155" height="172" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" values="-183;1037;1037" keyTimes="0;.3;1" dur="12s" repeatCount="indefinite"/></rect></g>
  <rect x="117.75" y="44.75" width="618.5" height="170.5" rx="36" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <text class="t in" x="427" y="116" text-anchor="middle" fill="#fff" font-size="50" font-weight="700" letter-spacing="-1">Ashutosh Devu</text>
  <text class="t in d1" x="427" y="148" text-anchor="middle" fill="#fff" fill-opacity=".72" font-size="18">Full-Stack &amp; Mobile Developer  ·  UI/UX</text>
  <g class="in d2">
    <rect x="322" y="166" width="210" height="28" rx="14" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".22"/>
    <circle class="pulse" cx="340" cy="180" r="4.5" fill="#30d158"/>
    <text class="t" x="352" y="185" fill="#fff" fill-opacity=".85" font-size="13">Building RideTogether</text>
  </g>
</g>
<rect x=".5" y=".5" width="853" height="259" rx="28" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
